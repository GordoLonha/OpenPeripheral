[package]
name = "openperipheral-app"
version.workspace = true
description = "OpenPeripheral desktop app"
edition = "2021"
license.workspace = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
op-core = { path = "../../crates/op-core" }
hidapi.workspace = true
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
enigo = "0.6.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target."cfg(target_os = \"linux\")".dependencies]
evdev = "0.12"
libc = "0.2"
signal-hook = "0.3"
x11rb = { version = "0.13", features = ["res"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Foundation"] }
