# OpenPeripheral device database: every Corsair (VID 1B1C) USB product we know of.
# Embedded in op-core at build time; entries in <config dir>/dev.openperipheral.app/devices.toml
# are merged on top (same pid = replaced), so a user can try a device without rebuilding.
#
# Fields (one [[device]] per USB PID):
#   pid       USB product ID
#   name      product name
#   kind      keyboard | mouse | mousepad | headset | headset-dongle | dongle | cooler | controller | psu | other
#   family    protocol: "nxp" = K70 MK.2 legacy 64-byte 07/0E/7F commands (protocol/k70_mk2_lp.md),
#             "bragi" = HS80 and newer (protocol/hs80_bragi.md). Omitted when unknown.
#   status    verified  = tested on real hardware with OpenPeripheral
#             community = reported working by a user, not by the maintainers
#             untested  = known to exist only; OpenPeripheral never writes to it (read-only)
#   control   vendor HID collections the driver uses, as "usage_page:usage" (hex)
#   leds      LED slots in a lighting frame;  layout = key layout id (layout/<id>_*.json)
#   features  what the driver does on this device
#   pairs     other PIDs that are the same physical device (receiver <-> headset on its cable)
#   sources   who knows this PID: openperipheral, openlinkhub, openrgb, liquidctl (facts only, no code)
#
# A new device of a family we already drive works by adding (or promoting) its entry here,
# setting family, control and status. Run `cargo run -p opctl -- udev-rules > linux/70-openperipheral.rules`
# afterwards. Untested entries were seeded by tools/seed_devices.py.

[[device]]
pid = 0x1B55
name = "K70 RGB MK.2 Low Profile"
kind = "keyboard"
family = "nxp"
status = "verified"
control = { command = "FFC2:0004", reply = "FFC2:0003", keys = "FFC0:0002" }
leds = 168
layout = "k70_mk2_lp"
features = ["lighting", "software-mode", "key-events", "key-remap", "firmware-info", "win-lock"]
sources = ["openperipheral", "openlinkhub", "openrgb"]

[[device]]
pid = 0x0A6B
name = "HS80 RGB Wireless (receiver)"
kind = "headset-dongle"
family = "bragi"
status = "verified"
control = { command = "FF42:0001", events = "FF42:0002" }
leds = 3
features = ["lighting", "software-mode", "battery", "charge-state", "wheel-events"]
pairs = [0x0A69, 0x0A6A]
sources = ["openperipheral", "openlinkhub"]

[[device]]
# Same headset on its USB cable (serial matches the wireless headset).
pid = 0x0A69
name = "HS80 RGB (USB cable)"
kind = "headset"
family = "bragi"
status = "verified"
control = { command = "FF42:0001", events = "FF42:0002" }
leds = 3
features = ["lighting", "software-mode", "battery", "charge-state", "wheel-events"]
pairs = [0x0A6B]
sources = ["openperipheral", "openlinkhub"]

[[device]]
# Cable plugged in while the headset is off: HID only, no audio, nothing to drive.
pid = 0x0A6A
name = "HS80 RGB (USB cable, headset off)"
kind = "headset"
family = "bragi"
status = "verified"
features = ["presence"]
pairs = [0x0A6B]
sources = ["openperipheral"]

